---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (shellcheck + JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # shellcheck reads each file's `#!/usr/bin/env bash` shebang, so the
      # extension-less `opencode-offline` CLI is linted too.
      - name: shellcheck
        run: shellcheck pack.sh opencode-offline

      # Config template holds __PLACEHOLDER__ strings but is still valid JSON.
      - name: Validate config JSON
        run: jq empty templates/opencode.json
